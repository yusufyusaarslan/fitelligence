<style>
/* Layout: training console — fixed sidebar (brand, nav, 12-week cycle) + main column (week strip, session hero, movement list / movement detail).
   Run mode takes over the main column as a focus screen. Deliberately dark-only: it is used mid-workout, often in a dim room. */
:root{
  --bg:#0C0F11; --bg-2:#101417; --surface:#151A1E; --surface-2:#1B2126; --surface-3:#232A30;
  --line:#262E34; --line-2:#323B42;
  --ink:#ECEFF1; --muted:#8E9AA1; --faint:#5E6A71;
  --amber:#F0B323; --amber-2:#FFCB52; --amber-ink:#17130A; --amber-glow:rgba(240,179,35,.16);
  --ok:#4CC38A; --ok-soft:rgba(76,195,138,.14); --muscle:#FF6A4D;
  --ground:#DCDCDE;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:9px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;padding:26px 18px 22px;padding-left:max(18px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--bg-2)}
.brand{display:flex;align-items:center;gap:11px}
.brand .logo{width:40px;height:40px;flex:none;display:block}
.brand .wm{position:relative;display:block;height:27px;aspect-ratio:335/96}
.brand .wm img,.brand .wrest{position:absolute;inset:0;width:100%;height:100%}

.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-sm);font-weight:600;color:var(--muted);text-align:left}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--amber)}
.cycle{margin-top:auto;display:grid;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.cycle .cw{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.cycle .cw small{font-size:16px;color:var(--muted);font-weight:600}
.cycle .cn{font-weight:600}
.segs{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.segs i{height:6px;border-radius:2px;background:var(--surface-3)}
.segs i.done{background:var(--amber)}
.segs i.cur{background:var(--amber-2);box-shadow:0 0 0 2px var(--amber-glow)}
.segs i.light{background:var(--line-2)}
.segs i.light.done{background:#A8842E}
.bk{display:flex;gap:6px}
.bk button{flex:1;font:inherit;font-size:12.5px;font-weight:600;padding:7px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer}
.bk button:hover{color:var(--ink);border-color:var(--amber)}
.cycle p{margin:0;color:var(--muted);font-size:13px}

.main{min-width:0;padding-block:24px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.topbar{display:none}

/* week */
.weekhead{display:flex;align-items:center;gap:10px}
.weekhead .wt{flex:1;min-width:0;display:grid;gap:2px}
.weekhead .wt b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.01em}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
.pill{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);font-weight:600;font-size:14px}
.pill:hover{background:var(--surface-2)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{position:relative;display:grid;justify-items:center;gap:6px;padding:12px 4px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);min-width:0;transition:border-color .15s,background .15s}
.day:hover{border-color:var(--line-2)}

const rad=d=>d*Math.PI/180;
const dir=d=>[Math.sin(rad(d)),-Math.cos(rad(d))];
const add=(p,v,s=1)=>[p[0]+v[0]*s,p[1]+v[1]*s];
function ik(S,T,l1,l2,bend){
  const dx=T[0]-S[0],dy=T[1]-S[1];let d=Math.hypot(dx,dy);
  d=Math.min(l1+l2-0.01,Math.max(Math.abs(l1-l2)+0.01,d));
  const a=Math.atan2(dy,dx),c=Math.acos((l1*l1+d*d-l2*l2)/(2*l1*d));
  const ang=a+bend*c;const E=[S[0]+l1*Math.cos(ang),S[1]+l1*Math.sin(ang)];
  const k=Math.hypot(T[0]-E[0],T[1]-E[1])||1;
  return [E,[E[0]+(T[0]-E[0])/k*l2,E[1]+(T[1]-E[1])/k*l2]];
}
function solve(p){
  let A,K,H;
  if(p.hip){H=p.hip;K=add(H,dir(p.t),-L.thigh);A=add(K,dir(p.s),-L.shin)}
  else{A=p.ankle;K=add(A,dir(p.s),L.shin);H=add(K,dir(p.t),L.thigh)}
  const toe=add(A,p.foot||[13,5]);
  const S=add(H,dir(p.b),L.torso),N=add(S,dir(p.b),L.neck),C=add(N,dir(p.b+(p.ht||0)),L.head);
  let E,W;
  if(p.hand){[E,W]=ik(S,p.hand,L.upper,L.fore,p.bend||1)}
  else{E=add(S,dir(p.u),L.upper);W=add(E,dir(p.f),L.fore)}
  return {A,K,H,toe,S,N,C,E,W};
}
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function lerpPose(a,b,k){
  const o={};
  for(const key of Object.keys(a)){
    const va=a[key],vb=b[key]===undefined?va:b[key];
    if(Array.isArray(va))o[key]=va.map((v,i)=>v+(vb[i]-v)*k);
    else if(typeof va==='number')o[key]=va+(vb-va)*k;
    else o[key]=va;
  }
  return o;
}

/* ===================== IMAGE-SEQUENCE ANIMATION (frames drawn by an image model) ===================== */
function imgPos(A,t){
  const n=A.frames.length-1,T=A.down+A.holdB+A.up+A.holdT;let x=t%T;
  const e=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

  box.innerHTML=`<div class="floorband"></div>${A.frames.map((u,i)=>`<img src="${u}" alt="" draggable="false" style="opacity:${i?0:1}">`).join('')}`;
  host.insertBefore(box,host.firstChild);

  const show=p=>{const a=Math.floor(p),b=Math.min(imgs.length-1,a+1),f=p-a;imgs.forEach((im,i)=>{im.style.opacity=i===a?1:i===b?f:0})};

    if(opts.label){opts.label.textContent=A.labels[r.i];opts.label.classList.toggle('hold',r.i===1||r.i===3)}

function planFor(date){return PROGRAM.find(p=>p.id===DOW_PLAN[parse(date).getDay()])||null}
function phaseInfo(date){
  const w=Math.floor((parse(date)-parse(PROGRAM_START))/864e5/7)+1;
  if(w<1)return {w:0,name:'Başlamadan önce',drop:0,note:'Program 26 Ekim Pazartesi başlıyor. Bu hafta istersen bir antrenmanı deneme olarak yap; hareketleri öğren.'};
  const cw=((w-1)%12)+1;
  if(cw<=2)return {w,cw,name:'Alışma',drop:1,note:'Her harekette 1 set eksik. Setleri tükenmeye 3 tekrar kala bitir, formu öğren.'};
  if(cw<=6)return {w,cw,name:'Yüklenme 1',drop:0,note:'Tüm setler. Tükenmeye 1–2 tekrar kala bitir; tüm setlerde üst sınıra ulaşınca zorlaştır.'};
  if(cw===7)return {w,cw,name:'Hafif hafta',drop:-1,note:'Setler yarıya iner, ağırlık aynı kalır. Vücut toparlanır.'};
  if(cw<=11)return {w,cw,name:'Yüklenme 2',drop:0,note:'Ağırlık bitince tempo ve zor varyasyonlarla ilerle.'};
  return {w,cw,name:'Hafif hafta + ölçüm',drop:-1,note:'Setler yarıya iner. Hafta sonunda kilo, bel ölçüsü ve fotoğraf al; 12 haftalık döngü biter.'};
}

// Supersets alternate: A set 1 → B set 1 → A set 2 …
function buildQueue(p,date){
  const q=[];
  for(let i=0;i<p.ex.length;i++){
    const a=p.ex[i],na=setsFor(a,date);
    if(a.ss&&p.ex[i+1]){const b=p.ex[i+1],nb=setsFor(b,date);
      for(let s=0;s<Math.max(na,nb);s++){if(s<na)q.push({ex:i,set:s,of:na});if(s<nb)q.push({ex:i+1,set:s,of:nb})}
      i++;continue}
    for(let s=0;s<na;s++)q.push({ex:i,set:s,of:na});
  }
  return q;
}

    const cX=dir<0?x0-col:x0+hw;s+=`<rect x="${cX}" y="${cy-9}" width="${col}" height="18" rx="2" fill="#C9D0D4"/>`;

  const K={'44':[[2,'4 plaka · '+kg(4)+' kg'],[2,'4 plaka · '+kg(4)+' kg']],'22':[[1,'2 plaka · '+kg(2)+' kg'],[1,'2 plaka · '+kg(2)+' kg']],'62':[[3,'6 plaka · '+kg(6)+' kg']]}[ex.kur];
  const list=ex.mode==='tek'?[K[0]]:K;
  const txt=ex.mode==='tek'?`Tek dambıl: her tarafa ${list[0][0]} plaka`:`İki dambıl: her birinin her tarafına ${list[0][0]} plaka`;
  return `<div class="setup" aria-label="${txt}">${dbSVG(list[0][0],list[0][1].split(' · ')[1])}${list.length>1?'<span class="x2">x2</span>':''}</div>`;
}
function thumbHTML(ex,i){
  const pz=poster(ex);
  return `<span class="thumb">${pz?`<img src="${pz}" alt="" loading="lazy">`:`<span class="n">${i+1}</span>`}${pz?`<span class="ix">${i+1}</span>`:''}</span>`;
}

     ${fin&&fin.done?`<div class="stat" style="align-self:center"><span class="donetag">${IC.check.replace('<svg','<svg width="16" height="16"')}Tamamlandı · ${Math.round(fin.dur/60)} dk</span></div>`:''}</div></div>

      <span><b>${esc(e.name)}${e.ss?'<span class="ss">Süperset</span>':''}</b><small>${e.kur?KUR[e.kur].w:MODE[e.mode]} · ${repsLabel(e)}</small></span>
      <span class="sx">${setsFor(e,st.date)}<em>×</em></span></button></li>`).join('')}</ol>
    <section class="detail" aria-label="${esc(ex.name)}">

/* ===================== RUN ===================== */
function startRun(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  const p=planFor(st.date);
  st.run={date:st.date,pid:p.id,q:buildQueue(p,st.date),i:0,mode:'warm',wi:0,started:Date.now(),setStart:Date.now(),restEnd:0,restLen:0,lastBeep:-1};
  keepAwake(true);tone(660,.12);render();window.scrollTo({top:0});
}
function beginSets(){const r=st.run;r.mode='work';r.setStart=Date.now();tone(990,.25,.28);renderRun()}
function finishSet(){
  const r=st.run,p=planFor(r.date),cur=r.q[r.i];
  if(r.i>=r.q.length-1){toCool();return}
  r.restLen=p.ex[cur.ex].rest;r.mode='rest';r.restEnd=Date.now()+r.restLen*1000;r.lastBeep=-1;renderRun();
}
function nextSet(){const r=st.run;r.i++;r.mode='work';r.setStart=Date.now();tone(990,.25,.28);renderRun()}
function warmSet(ex){
  if(ex.mode==='vucut')return ['8',ex.name+' · dizler yerde'];
  return ['8',ex.name+' · '+(ex.mode==='tek'?`${kg(2)} kg`:`2 × ${kg(2)} kg`)];
}
function warmList(r){const p=PROGRAM.find(x=>x.id===r.pid),first=p.ex[r.q[0].ex],ws=warmSet(first);
  return (WARM_PLAN[r.pid]||[]).map(k=>WARMUPS[k]).concat([Object.assign({},first,{reps:ws[0]+' tekrar · hafif',light:true,wname:ws[1]})])}
function toCool(){const r=st.run;r.mode='cool';r.coolStart=Date.now();tone(784,.15);renderRun()}
function completeRun(){
  const r=st.run;const dur=Math.round((Date.now()-r.started)/1000);
  st.log[r.date]={done:true,sets:r.i+1,dur,finishedAt:new Date().toISOString()};store();
  r.mode='done';r.dur=dur;keepAwake(false);tone(784,.15);setTimeout(()=>tone(1046,.3),170);renderRun();
}
function quitRun(){st.run=null;keepAwake(false);stopAnim();render()}
const RING_C=2*Math.PI*108;
function renderRun(){
  const r=st.run,p=PROGRAM.find(x=>x.id===r.pid),v=document.getElementById('view');stopAnim();
  document.getElementById('weekbox').hidden=true;
  if(r.mode==='done'){
    v.innerHTML=`<section class="donebox"><span class="donetag">${IC.check.replace('<svg','<svg width="16" height="16"')}Antrenman tamamlandı</span><h1>${esc(p.name)} bitti</h1>
      <div class="stats"><div class="stat"><b>${r.i+1}</b><span>set</span></div><div class="stat"><b>${mmss(r.dur)}</b><span>süre</span></div><div class="stat"><b>${p.ex.length}</b><span>hareket</span></div></div>
      <button type="button" class="cta" id="backPlan">Programa dön</button></section>`;return}
  const head=`<div class="runbar"><span class="rt">${esc(p.name)} <span>· ${r.mode==='warm'?'Isınma':r.mode==='cool'?'Soğuma':`${r.i+1}/${r.q.length}`}</span></span>
      <span class="clock" id="elapsed">${mmss((Date.now()-r.started)/1000)}</span>
      ${r.mode==='warm'||r.mode==='cool'?'':'<button type="button" class="ghost" id="skipSet">Bu seti atla</button>'}<button type="button" class="ghost" id="endRun">Bitir</button></div>
    <div class="track" aria-hidden="true">${r.q.map((_,k)=>`<i class="${r.mode==='cool'||(r.mode!=='warm'&&(k<r.i||(k===r.i&&r.mode==='rest')))?'done':r.mode!=='warm'&&k===r.i?'cur':''}"></i>`).join('')}</div>`;
  if(r.mode==='cool'){
    v.innerHTML=`<div class="runwrap">${head}<div class="runbody">
      <section class="card warm"><span class="eyebrow">2 dakika</span><h2 style="margin:0;font-family:var(--display);font-weight:800;font-size:40px;line-height:.95;text-transform:uppercase">Soğuma</h2>
        <ol>${COOL.map(([a,b])=>`<li><b>${a}</b><span>${esc(b)}</span></li>`).join('')}</ol></section>
      <div class="runside"><section class="card setcard"><span class="eyebrow">Setler bitti</span>
        <button type="button" class="cta big" id="coolDone">${IC.check}Bitirdim</button></section></div>
    </div></div>`;return}
  if(r.mode==='warm'){
    const W=warmList(r),wi=Math.min(r.wi||0,W.length-1),w=W[wi],last=wi===W.length-1;
    const wq=`<section class="card" style="padding:12px"><span class="eyebrow" style="padding:4px 8px">Isınma</span><ol class="queue">${W.map((x,k)=>`<li class="${k<wi?'done':k===wi?'cur':''}"><span>${esc(x.light?x.name+' (hafif)':x.name)}</span><span class="qs">${esc(x.reps.replace(' tekrar · hafif','').replace(' tekrar',''))}</span></li>`).join('')}</ol></section>`;
    v.innerHTML=`<div class="runwrap">${head}<div class="runbody">
     <section class="runmedia"><div class="rmh"><span class="eyebrow">Isınma · ${wi+1}/${W.length}</span><h2>${esc(w.name)}</h2>${w.light?`<div class="chips"><span class="chip w">${esc(w.wname.split(' · ').pop())}</span></div>`:''}${w.light?'':setupHTML(w)}</div>${stageHTML(w)}</section>
     <div class="runside"><section class="card setcard"><span class="eyebrow">${w.light?'Hafif ısınma seti':'Isınma'}</span>
       <div class="target"><b>${esc(w.reps.split(' ')[0])}</b><span>${esc(w.reps.split(' ').slice(1).join(' '))}</span></div>
       <button type="button" class="cta big" id="${last?'warmDone':'warmNext'}">${last?IC.play+'Isındım, başla':IC.check+'Sıradaki'}</button>
       ${last?'':'<button type="button" class="ghost" id="warmDone" style="justify-self:center">Isınmayı atla</button>'}</section>${wq}</div>
    </div></div>`;
    mountMain(w);return}
  const cur=r.q[r.i],ex=p.ex[cur.ex],resting=r.mode==='rest',nxt=r.q[r.i+1],nex=nxt?p.ex[nxt.ex]:null;
  const show=resting&&nex?nex:ex,sq=resting?nxt:cur;
  const qlist=`<section class="card" style="padding:12px"><span class="eyebrow" style="padding:4px 8px">Sıra</span><ol class="queue">${r.q.map((x,k)=>`<li class="${k<r.i||(k===r.i&&resting)?'done':k===(resting?r.i+1:r.i)?'cur':''}"><span>${esc(p.ex[x.ex].name)}</span><span class="qs">${x.set+1}/${x.of}</span></li>`).join('')}</ol></section>`;
  const left=Math.max(0,(r.restEnd-Date.now())/1000);
  const side=resting?`<section class="card restcard" role="timer" aria-live="off"><span class="eyebrow">Mola</span>
      <div class="ring"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="108" fill="none" stroke="var(--surface-3)" stroke-width="12"/>
        <circle id="ringArc" cx="120" cy="120" r="108" fill="none" stroke="var(--amber)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="${(RING_C*(1-left/r.restLen)).toFixed(1)}"/></svg>
        <div class="tv"><b id="restT">${mmss(Math.ceil(left))}</b><span>kalan</span></div></div>
      <div class="nextup"><span>Sıradaki · Set ${nxt.set+1}/${nxt.of}</span><b>${esc(nex.name)}</b><span>${repsLabel(nex)}${nex.kur?' · '+KUR[nex.kur].w:''}</span></div>
      <div class="row"><button type="button" class="btn2" id="addRest">+15 sn</button><button type="button" class="btn2 am" id="goNow">Hemen başla</button></div></section>`
   :`<section class="card setcard">${ex.each?'<span class="eyebrow">Her taraf ayrı</span>':''}
      <div class="setno"><b>Set ${cur.set+1}</b><span>/ ${cur.of}</span></div>
      <div class="target"><b>${ex.lo}–${ex.hi}</b><span>${unit(ex)}${ex.kur?' · '+KUR[ex.kur].w:''}</span></div>
      ${ex.mode==='sure'?`<div class="target"><b id="hold">0:00</b><span>geçen süre</span></div>`:''}
      ${ex.mode==='sure'?'':`<p class="cue">${phaseInfo(r.date).drop===1?'3':'1–2'} tekrar kala bırak</p>`}
      <button type="button" class="cta big" id="doneSet">${IC.check}Seti bitirdim</button></section>`;
  v.innerHTML=`<div class="runwrap">${head}<div class="runbody">
     <section class="runmedia"><div class="rmh"><span class="eyebrow">${resting?'Sıradaki hareket':'Şimdi'} · Set ${sq.set+1}/${sq.of}</span><h2>${esc(show.name)}</h2><div class="chips">${chipsHTML(show)}</div>${setupHTML(show)}</div>${stageHTML(show)}</section>
     <div class="runside">${side}${qlist}</div>
    </div></div>`;
  mountMain(show);
  const qc=v.querySelector('.queue li.cur');if(qc)qc.scrollIntoView({block:'nearest'});
}
setInterval(()=>{
  const r=st.run;if(!r||r.mode==='done'||st.tab!=='today')return;
  const el=document.getElementById('elapsed');if(el)el.textContent=mmss((Date.now()-r.started)/1000);
  if(r.mode==='work'){const h=document.getElementById('hold');if(h)h.textContent=mmss((Date.now()-r.setStart)/1000);return}
  if(r.mode!=='rest')return;
  const left=(r.restEnd-Date.now())/1000,t=document.getElementById('restT');if(t)t.textContent=mmss(Math.max(0,Math.ceil(left)));
  const arc=document.getElementById('ringArc');if(arc)arc.setAttribute('stroke-dashoffset',(RING_C*(1-Math.max(0,left)/r.restLen)).toFixed(1));
  const s=Math.ceil(left);if(s<=3&&s>0&&r.lastBeep!==s){r.lastBeep=s;tone(660,.1,.18)}
  if(left<=0)nextSet();
},100);

  stopAnim();const v=document.getElementById('view');
  if(st.libEx){const [pid,eid]=st.libEx.split(':');const p=pid==='w'?{name:'Isınma',ex:Object.values(WARMUPS)}:PROGRAM.find(x=>x.id===pid),ex=p&&p.ex.find(e=>e.id===eid);
    if(ex){v.innerHTML=`<button type="button" class="back" data-libback="1"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Hareketler</button>
     <section class="detail" aria-label="${esc(ex.name)}"><div class="dtop"><span class="eyebrow">${esc(p.name)}</span><h2>${esc(ex.name)}</h2><small class="dsub">${pid==='w'?MODE[ex.mode]+' · '+ex.reps:(ex.kur?KUR[ex.kur].w:MODE[ex.mode])+' · '+repsLabel(ex)}</small></div>

    <button type="button" class="lcard" data-open="w:${e.id}"><div class="th">${poster(e)?`<img src="${poster(e)}" alt="" loading="lazy">`:`<span class="n">${i+1}</span>`}</div>
    <div class="cb"><b>${esc(e.name)}</b><small>${MODE[e.mode]} · ${e.reps}</small></div></button>`).join('')}</div></section>`+PROGRAM.map(p=>`<section class="libgroup"><h2>${esc(p.name)} · ${esc(p.focus)}</h2><div class="lib">${p.ex.map((e,i)=>`
    <button type="button" class="lcard" data-open="${p.id}:${e.id}"><div class="th">${poster(e)?`<img src="${poster(e)}" alt="" loading="lazy">`:`<span class="n">${i+1}</span>`}</div>
    <div class="cb"><b>${esc(e.name)}</b><small>${MODE[e.mode]} · ${repsLabel(e)}</small></div></button>`).join('')}</div></section>`).join('');
}
function render(){
  renderNav();renderWeek();
  if(st.tab==='lib'){renderLib();return}
  st.run&&st.run.date===st.date?renderRun():renderPlan();
}

/* ===================== EVENTS ===================== */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.wk!==undefined){const v=+t.dataset.wk;st.wk=v===0?0:st.wk+v;const ds=weekDays();const inw=ds.some(d=>ymd(d)===ymd(today));
    st.date=inw?defaultDate():ymd(ds.find(d=>planFor(ymd(d)))||ds[0]);st.ex=null;st.tab='today';render();return}
  if(t.dataset.tab){st.tab=t.dataset.tab;st.libEx=null;render();window.scrollTo({top:0});return}
  if(t.dataset.date){st.date=t.dataset.date;st.ex=null;st.tab='today';render();return}
  if(t.dataset.ex){st.ex=t.dataset.ex;renderPlan();return}
  if(t.dataset.open){st.libY=window.scrollY;st.libEx=t.dataset.open;renderLib();window.scrollTo({top:0});return}
  if(t.dataset.libback){st.libEx=null;renderLib();window.scrollTo({top:st.libY||0});return}
  switch(t.id){
    case 'startRun':startRun();break;
    case 'warmDone':beginSets();break;
    case 'warmNext':st.run.wi=(st.run.wi||0)+1;tone(880,.1);renderRun();break;
    case 'coolDone':completeRun();break;
    case 'doneSet':finishSet();break;
    case 'goNow':nextSet();break;
    case 'addRest':st.run.restEnd+=15000;st.run.restLen+=15;break;
    case 'skipSet':if(st.run.mode==='rest')nextSet();else finishSet();break;
    case 'endRun':if(st.run.mode==='cool'){completeRun();break}if(st.run.mode==='warm'||(st.run.i===0&&st.run.mode==='work'))quitRun();else{st.run.i=Math.max(0,st.run.i-(st.run.mode==='rest'?0:1));completeRun()}break;
    case 'backPlan':quitRun();break;
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.code!=='Space'||!st.run||st.tab!=='today'||ev.target.closest('input,textarea'))return;
  ev.preventDefault();const m=st.run.mode;if(m==='warm'){const W=warmList(st.run);if((st.run.wi||0)<W.length-1){st.run.wi++;renderRun()}else beginSets()}else if(m==='cool')completeRun();else if(m==='work')finishSet();else if(m==='rest')nextSet();
});
render();

});
